<svg xmlns="http://www.w3.org/2000/svg" width="1830" height="1150" viewBox="0 0 1830 1150">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0d3050"/>
      <stop offset="45%" stop-color="#0a2035"/>
      <stop offset="100%" stop-color="#071929"/>
    </linearGradient>
    <radialGradient id="shelfMain" cx="0.06" cy="0.35" r="0.55">
      <stop offset="0%"  stop-color="#154a70" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#154a70" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shelfFalk" cx="0.615" cy="0.36" r="0.22">
      <stop offset="0%"  stop-color="#154a70" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#154a70" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shelfSG" cx="0.955" cy="0.58" r="0.16">
      <stop offset="0%"  stop-color="#154a70" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#154a70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#5a4a2e"/>
      <stop offset="100%" stop-color="#3c3220"/>
    </linearGradient>
  </defs>

  <!-- ── Oceano ──────────────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="1830" height="1150" fill="url(#ocean)"/>
  <rect x="0" y="0" width="1830" height="1150" fill="url(#shelfMain)"/>
  <rect x="0" y="0" width="1830" height="1150" fill="url(#shelfFalk)"/>
  <rect x="0" y="0" width="1830" height="1150" fill="url(#shelfSG)"/>

  <!-- ── Graticule (referência cartográfica, decorativo) ────────────────── -->
  <g stroke="rgba(180,210,240,0.09)" stroke-width="1" stroke-dasharray="2 10">
    <line x1="0" y1="140" x2="1830" y2="140"/>
    <line x1="0" y1="341" x2="1830" y2="341"/>
    <line x1="0" y1="542" x2="1830" y2="542"/>
    <line x1="0" y1="743" x2="1830" y2="743"/>
    <line x1="0" y1="944" x2="1830" y2="944"/>
    <line x1="230"  y1="0" x2="230"  y2="1150"/>
    <line x1="530"  y1="0" x2="530"  y2="1150"/>
    <line x1="830"  y1="0" x2="830"  y2="1150"/>
    <line x1="1130" y1="0" x2="1130" y2="1150"/>
    <line x1="1430" y1="0" x2="1430" y2="1150"/>
    <line x1="1730" y1="0" x2="1730" y2="1150"/>
  </g>
  <g fill="rgba(180,210,240,0.22)" font-family="Courier New, monospace" font-size="15">
    <text x="8" y="132">45°S</text>
    <text x="8" y="333">49°S</text>
    <text x="8" y="534">52°S</text>
    <text x="8" y="735">55°S</text>
    <text x="8" y="936">57°S</text>
    <text x="60"  y="1140">68°W</text>
    <text x="1090" y="1140">59°W</text>
    <text x="1700" y="1140">37°W</text>
  </g>

  <!-- ── Zona de Exclusão Total (referência histórica, decorativo) ──────── -->
  <circle cx="1130" cy="410" r="290" fill="none" stroke="#c9a84c" stroke-opacity="0.30" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1130" y="102" text-anchor="middle" fill="#c9a84c" fill-opacity="0.45" font-family="Courier New, monospace" font-size="14" letter-spacing="2">ZONA DE EXCLUSÃO — 200mn</text>

  <!-- ── Massa continental — Patagônia argentina ─────────────────────────── -->
  <path fill="url(#land)" stroke="#8a7040" stroke-opacity="0.5" stroke-width="2" d="
    M 0,0
    C 100,5 200,70 238,145
    C 270,200 210,220 200,240
    C 225,265 250,300 238,345
    C 225,400 205,430 185,475
    C 165,515 175,555 155,585
    C 140,610 165,640 145,660
    L 0,660
    Z"/>

  <!-- ── Ilha Falkland Ocidental (West Falkland) ─────────────────────────── -->
  <path fill="url(#land)" stroke="#8a7040" stroke-opacity="0.5" stroke-width="2" d="
    M 970,300 C 1030,270 1080,310 1085,360
    C 1090,400 1070,380 1075,420
    C 1080,460 1095,480 1085,520
    C 1075,565 1030,600 985,590
    C 940,580 920,530 925,480
    C 930,430 910,400 930,360
    C 950,320 950,320 970,300 Z"/>

  <!-- ── Ilha Falkland Oriental (East Falkland) ──────────────────────────── -->
  <path fill="url(#land)" stroke="#8a7040" stroke-opacity="0.5" stroke-width="2" d="
    M 1150,290 C 1210,260 1260,280 1275,320
    C 1290,350 1270,340 1280,370
    C 1310,390 1330,420 1320,450
    C 1340,470 1330,510 1300,530
    C 1320,560 1290,590 1250,595
    C 1210,600 1180,570 1170,530
    C 1150,500 1160,460 1145,420
    C 1130,380 1130,330 1150,290 Z"/>

  <!-- ── Geórgia do Sul ───────────────────────────────────────────────────── -->
  <path fill="url(#land)" stroke="#8a7040" stroke-opacity="0.5" stroke-width="2" d="
    M 1700,480 C 1740,470 1770,500 1780,540
    C 1800,580 1790,610 1810,650
    C 1825,690 1805,720 1815,760
    C 1820,800 1790,820 1760,800
    C 1740,790 1750,760 1730,730
    C 1710,700 1715,670 1695,640
    C 1675,610 1680,580 1665,550
    C 1655,520 1670,490 1700,480 Z"/>

  <!-- ── Rótulos geográficos ─────────────────────────────────────────────── -->
  <g fill="#c9d8e8" fill-opacity="0.55" font-family="Georgia, serif" font-style="italic">
    <text x="60"  y="45"  font-size="26" letter-spacing="3">ARGENTINA</text>
    <text x="820" y="720" font-size="30" letter-spacing="4" text-anchor="middle">ATLÂNTICO SUL</text>
    <text x="1130" y="640" font-size="17" text-anchor="middle">ILHAS MALVINAS / FALKLAND</text>
    <text x="1745" y="880" font-size="15" text-anchor="middle">GEÓRGIA<tspan x="1745" dy="17">DO SUL</tspan></text>
    <text x="175" y="170" font-size="12" fill-opacity="0.8">Comodoro Rivadavia</text>
    <text x="175" y="271" font-size="12" fill-opacity="0.8">San Julián</text>
    <text x="175" y="371" font-size="12" fill-opacity="0.8">Río Gallegos</text>
    <text x="30"  y="522" font-size="12" fill-opacity="0.8">Río Grande</text>
    <text x="1215" y="432" font-size="12" fill-opacity="0.85">Porto Argentino</text>
    <text x="960"  y="452" font-size="12" fill-opacity="0.8">Port Howard</text>
  </g>

  <!-- ── Rosa dos ventos ──────────────────────────────────────────────────── -->
  <g transform="translate(1740,90)" opacity="0.55">
    <circle r="34" fill="none" stroke="#c9a84c" stroke-width="1"/>
    <polygon points="0,-30 5,-6 0,0 -5,-6" fill="#c9a84c"/>
    <polygon points="0,30 5,6 0,0 -5,6" fill="#7a7a7a"/>
    <polygon points="-30,0 -6,5 0,0 -6,-5" fill="#7a7a7a"/>
    <polygon points="30,0 6,5 0,0 6,-5" fill="#7a7a7a"/>
    <text x="0" y="-38" text-anchor="middle" font-size="13" fill="#c9a84c" font-weight="bold">N</text>
  </g>

  <!-- ── Moldura ──────────────────────────────────────────────────────────── -->
  <rect x="2" y="2" width="1826" height="1146" fill="none" stroke="rgba(201,168,76,0.25)" stroke-width="3"/>
</svg>
